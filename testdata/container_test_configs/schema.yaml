# Container test config schema for `forgetool container test`
#
# All fields are optional. Checks run only when provided.
#
# `externalStorage` is for mounts that must exist.
# If this list is provided, `/config` is always included automatically.
timeoutSeconds: 10

# Container image used for `commands` checks.
# If omitted, TEST_IMAGE environment variable is used.
image: docker.io/library/alpine:3.22

# Optional environment variables injected into command-check containers.
env:
  SAMPLE_FLAG: "1"

# Paths that must exist
paths:
  - /app

# External storage mount points that must exist
externalStorage:
  - /data
  # /config is automatically checked too

# File checks
files:
  - path: /app/example-binary
    contains:
      - sample
    notContains:
      - forbidden

# HTTP endpoint checks mapped to HTTPTestConfig (port/path/status)
http:
  - port: "6767"
    path: /
    status: 200

# TCP connectivity checks
tcp:
  - host: 127.0.0.1
    port: 8080

# Custom container commands to run with TEST_IMAGE (non-zero exit fails the test)
commands:
  - test -x /app/example-binary
  - echo "custom checks passed"
