# Example checks for trueforge-org/containerforge app: adguardhome-sync
# https://github.com/trueforge-org/containerforge/tree/main/apps/adguardhome-sync
image: ghcr.io/trueforge-org/adguardhome-sync:latest
paths:
  - /app
  - /config
externalStorage:
  - /config
files:
  - path: /app/adguardhome-sync
urls:
  - url: http://127.0.0.1:8080
    status: 200
tcp:
  - host: 127.0.0.1
    port: 8080
commands:
  - test -x /app/adguardhome-sync
