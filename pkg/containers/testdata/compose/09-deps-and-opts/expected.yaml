name: myapp
services:
  myapp:
    container_name: myapp
    environment:
      APP_ENV: production
    image: ghcr.io/trueforge-org/myapp:1.0.0
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 8080
        published: "8080"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /mnt/tank/apps/myapp/config
        target: /config
  postgres:
    container_name: postgres
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_USER: postgres
    image: ghcr.io/trueforge-org/postgres:16.0
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 5432
        published: "5432"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: /mnt/tank/apps/postgres/data
        target: /var/lib/postgresql/data
