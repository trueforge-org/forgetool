name: myapp
services:
  myapp:
    container_name: myapp
    image: ghcr.io/trueforge-org/myapp:1.0.0
    ports:
      - mode: ingress
        target: 8080
        published: "8080"
        protocol: tcp
    restart: unless-stopped
  postgres:
    container_name: postgres
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
    image: ghcr.io/trueforge-org/postgres:16.0
    ports:
      - mode: ingress
        target: 5432
        published: "5432"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: data
        target: /var/lib/postgresql/data
