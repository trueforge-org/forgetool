name: myapp
services:
  myapp:
    container_name: myapp
    deploy:
      resources:
        limits:
          cpus: 4
          memory: 4G
    image: ghcr.io/trueforge-org/myapp:rolling
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 8080
        published: "8080"
        protocol: tcp
    restart: unless-stopped
