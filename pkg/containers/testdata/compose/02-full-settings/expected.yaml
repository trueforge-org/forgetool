name: myapp
services:
  myapp:
    container_name: myapp
    environment:
      PGID: "1000"
      PUID: "1000"
      TZ: UTC
    image: ghcr.io/trueforge-org/myapp:2.0.0
    ports:
      - mode: ingress
        target: 80
        published: "80"
        protocol: tcp
      - mode: ingress
        target: 443
        published: "443"
        protocol: tcp
      - mode: ingress
        target: 53
        published: "53"
        protocol: udp
    restart: unless-stopped
    volumes:
      - type: bind
        source: config
        target: /config
      - type: bind
        source: data
        target: /data
