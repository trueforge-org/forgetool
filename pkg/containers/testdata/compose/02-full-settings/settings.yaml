schema_version: 1
ports:
  - port: 80
    protocol: tcp
  - port: 443
    protocol: tcp
  - port: 53
    protocol: udp
env:
  - name: TZ
    default: UTC
  - name: PUID
    default: "1000"
  - name: PGID
    default: "1000"
volumes:
  - path: /config
    required: true
  - path: /data
    required: true
