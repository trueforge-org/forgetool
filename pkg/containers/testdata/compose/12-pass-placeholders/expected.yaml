name: myapp
services:
  myapp:
    cap_drop:
      - ALL
    container_name: myapp
    privileged: false
    deploy:
      resources:
        limits:
          cpus: 4
          memory: 4G
    environment:
      ALSO_DB_PASSWORD: test-secret-1
      CACHE_PASSWORD: test-secret-2
      DB_PASSWORD: test-secret-1
    group_add:
      - "568"
    image: ghcr.io/trueforge-org/myapp:1.0.0
    ports:
      - mode: ingress
        # host_ip: 127.0.0.1
        target: 8080
        published: "8080"
        protocol: tcp
    restart: unless-stopped
    shm_size: 256M
  postgres:
    cap_drop:
      - ALL
    container_name: postgres
    privileged: false
    deploy:
      resources:
        limits:
          cpus: 4
          memory: 4G
    environment:
      POSTGRES_DB: myapp
      POSTGRES_PASSWORD: test-secret-1
      POSTGRES_RO_DB: myapp-readonly
      POSTGRES_USER: myapp
    group_add:
      - "568"
    image: ghcr.io/trueforge-org/postgres:16.0
    ports:
      - mode: ingress
        # host_ip: 127.0.0.1
        target: 5432
        published: "5432"
        protocol: tcp
    restart: unless-stopped
    shm_size: 256M
    volumes:
      - type: bind
        source: /mnt/tank/apps/postgres/data
        target: /var/lib/postgresql/data
        read_only: false
  redis:
    cap_drop:
      - ALL
    container_name: redis
    privileged: false
    deploy:
      resources:
        limits:
          cpus: 4
          memory: 4G
    environment:
      REDIS_PASSWORD: test-secret-2
    group_add:
      - "568"
    image: ghcr.io/trueforge-org/redis:7.2
    ports:
      - mode: ingress
        # host_ip: 127.0.0.1
        target: 6379
        published: "6379"
        protocol: tcp
    restart: unless-stopped
    shm_size: 256M
