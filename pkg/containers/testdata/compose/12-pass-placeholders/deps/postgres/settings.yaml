schema_version: 1
ports:
  - port: 5432
    protocol: tcp
env:
  - name: POSTGRES_USER
    default: MYPOSTGRESUSER
  - name: POSTGRES_DB
    default: MYPOSTGRESDB
  - name: POSTGRES_RO_DB
    default: MYPOSTGRESDB-readonly
  - name: POSTGRES_PASSWORD
    default: MYPOSTGRESPASS
volumes:
  - path: /var/lib/postgresql/data
    required: true
