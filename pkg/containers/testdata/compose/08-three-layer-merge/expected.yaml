name: myapp
services:
  myapp:
    container_name: myapp
    image: ghcr.io/trueforge-org/myapp:1.0.0
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 8080
        published: "8080"
        protocol: tcp
    restart: unless-stopped
  postgres:
    container_name: postgres
    environment:
      LAYER_A: from-parent
      LAYER_B: dep-own-only
      LAYER_BASE_ONLY: base
      LAYER_C: parent-only
    image: ghcr.io/trueforge-org/postgres:16.0
    restart: always
    volumes:
      - type: bind
        source: /mnt/tank/apps/postgres/data
        target: /var/lib/postgresql/data
