name: myapp
services:
  myapp:
    container_name: myapp
    image: ghcr.io/trueforge-org/myapp:1.0.0
    ports:
      - mode: ingress
        target: 8080
        published: "8080"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: bind
        source: config
        target: /config
