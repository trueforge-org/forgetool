name: myapp
services:
  myapp:
    container_name: myapp
    deploy:
      resources:
        limits:
          cpus: 4
          memory: 4G
    image: ghcr.io/trueforge-org/myapp:1.0.0
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 8080
        published: "8080"
        protocol: tcp
    restart: unless-stopped
  postgres:
    container_name: postgres
    deploy:
      resources:
        limits:
          cpus: 4
          memory: 4G
    environment:
      POSTGRES_PASSWORD: from-dep-own
      POSTGRES_USER: postgres
    image: ghcr.io/trueforge-org/postgres:16.0
    labels:
      role: database
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 5432
        published: "5432"
        protocol: tcp
    restart: always
    volumes:
      - type: bind
        source: /mnt/tank/apps/postgres/data
        target: /var/lib/postgresql/data
