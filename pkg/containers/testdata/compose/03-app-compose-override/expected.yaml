name: myapp
services:
  myapp:
    cap_drop:
      - ALL
    container_name: myapp
    privileged: false
    deploy:
      resources:
        limits:
          cpus: 4
          memory: 4G
    environment:
      EXTRA_FLAG: "1"
      LOG_LEVEL: debug
    group_add:
      - "568"
    image: ghcr.io/trueforge-org/myapp:1.0.0
    labels:
      traefik.enable: "true"
    ports:
      - mode: ingress
        # host_ip: 127.0.0.1
        target: 8080
        published: "8080"
        protocol: tcp
    restart: always
    shm_size: 256M
    volumes:
      - type: bind
        source: /mnt/tank/apps/myapp/config
        target: /config
        read_only: false
