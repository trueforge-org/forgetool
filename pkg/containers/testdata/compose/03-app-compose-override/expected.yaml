name: myapp
services:
  myapp:
    container_name: myapp
    environment:
      EXTRA_FLAG: "1"
      LOG_LEVEL: debug
    image: ghcr.io/trueforge-org/myapp:1.0.0
    labels:
      traefik.enable: "true"
    ports:
      - mode: ingress
        target: 8080
        published: "8080"
        protocol: tcp
    restart: always
    volumes:
      - type: bind
        source: config
        target: /config
