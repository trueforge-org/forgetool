name: myapp
services:
  myapp:
    cap_add:
      - NET_BIND_SERVICE
      - SYS_ADMIN
    cap_drop:
      - ALL
    container_name: myapp
    privileged: false
    deploy:
      resources:
        limits:
          cpus: 4
          memory: 4G
    group_add:
      - "568"
    image: ghcr.io/trueforge-org/myapp:1.0.0
    ports:
      - mode: ingress
        # host_ip: 127.0.0.1
        target: 80
        published: "80"
        protocol: tcp
    restart: unless-stopped
    shm_size: 256M
