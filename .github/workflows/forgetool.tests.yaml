name: forgetool-go-tests
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:

  check_changes:
    runs-on: ubuntu-latest
    outputs:
      changes_detected: ${{ steps.filter.outputs.changed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          list-files: json
          filters: |
            changed:
            - '**'

  test:
    runs-on: ubuntu-latest   
    if: needs.check_changes.outputs.changes_detected == 'true'
    needs: check_changes
    steps:
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          cache: true
          cache-dependency-path: |
            **/go.mod
            **/go.sum
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: build
        run:  |
          set -o pipefail
          go build -o /tmp/forgetool
      - name: run
        run:  |
          set -o pipefail
          /tmp/forgetool
      - name: Unit Tests
        run:  |
          set -o pipefail
          go test -v ./... -race -covermode=atomic -coverprofile=coverage.txt 2>&1 | tee test_output.txt
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: "trueforge-org/forgetool"
      - name: Fail on no test files
        if: always()
        run: |
          if [ -f test_output.txt ]; then
            if grep -q '\[no test files\]' test_output.txt; then
              echo "Found [no test files] in test output" >&2
              cat test_output.txt
              exit 1
            fi
          else
            echo "test_output.txt not found; skipping no-test-files check"
          fi
          
