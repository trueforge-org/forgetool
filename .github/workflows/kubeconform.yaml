name: "Kubeconform"

on:
  pull_request:

concurrency:
  group: ${{ github.head_ref }}-pr-validate
  cancel-in-progress: true

env:
  KUBERNETES_DIR: /tmp/cluster-template/kubernetes

jobs:
  kubeconform:
    name: Kubeconform
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Setup Homebrew
        uses: Homebrew/actions/setup-homebrew@master
      - name: Setup Workflow Tools
        run: brew install fluxcd/tap/flux kubeconform kustomize
      - name: Download cluster-template release
        shell: bash
        run: |
          TAG_NAME="$(curl -fsSL https://api.github.com/repos/trueforge-org/cluster-template/releases/latest | jq -r .tag_name)"
          if [[ -z "$TAG_NAME" ]]; then
            echo "Failed to fetch or parse latest release tag from GitHub API" >&2
            exit 1
          fi
          curl -fsSL "https://codeload.github.com/trueforge-org/cluster-template/tar.gz/refs/tags/${TAG_NAME}" | tar -xz -C /tmp
          EXTRACTED_DIR="/tmp/cluster-template-${TAG_NAME}"
          if [[ ! -d "$EXTRACTED_DIR" ]]; then
            echo "Expected extracted cluster-template directory in /tmp" >&2
            exit 1
          fi
          rm -rf /tmp/cluster-template
          mv "$EXTRACTED_DIR" /tmp/cluster-template
      - name: Create dummy deploykey secret (CI only)
        shell: bash
        run: |
          SECRET_PATH="${KUBERNETES_DIR}/flux-system/flux/deploykey.secret.yaml"

          if [[ ! -f "$SECRET_PATH" ]]; then
            echo "Creating dummy deploykey.secret.yaml for kubeconform"
            mkdir -p "$(dirname "$SECRET_PATH")"
            touch "$SECRET_PATH"
          fi
      - name: Inject ConfigMap data for CI
        shell: bash
        run: |
          CONFIG_PATH="${KUBERNETES_DIR}/flux-system/flux/clustersettings.secret.yaml"

          if [[ -f "$CONFIG_PATH" ]]; then
            echo "Replacing REPLACEWITHENV in clustersettings.secret.yaml"

            # Example: replace with dummy key-values for CI
            sed -i "s|REPLACEWITHENV|  dummyKey: dummyValue|" "$CONFIG_PATH"
          fi
      - name: Run kubeconform
        shell: bash
        run: bash ./.github/scripts/kubeconform.sh ${{ env.KUBERNETES_DIR }}
