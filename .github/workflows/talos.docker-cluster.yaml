name: talos-docker-cluster

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  talos-cluster:
    runs-on: ubuntu-latest
    env:
      LOGLEVEL: debug
      DEBUG: "1"
      TALOS_VERSION: v1.12.0
      TALOS_IMAGE: ghcr.io/siderolabs/talos:v1.12.0
      CONTROL_IP: 10.5.0.2
      WORKER_IP: 10.5.0.3
      VIP: 10.5.0.2
      GATEWAY: 10.5.0.1
      METALLB_RANGE: 10.5.0.20-10.5.0.30
      DASHBOARD_IP: 10.5.0.21

    steps:
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6
        with:
          go-version: stable
          cache: true
          cache-dependency-path: |
            **/go.mod
            **/go.sum
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: ForgeTool runtest
        run: |
          set -euo pipefail
          echo "Running: go run ."
          go run .

      - name: Init ForgeTool cluster
        run: |
          set -euo pipefail
          echo "Running: go run . cluster init"
          go run . cluster init
          echo "cluster init completed"

      - name: Copy ForgeTool cluster Files
        run: |
          set -euo pipefail
          bash .github/scripts/init_cluster_env.sh

      - name: Second Init ForgeTool cluster
        run: |
          set -euo pipefail
          echo "Running: go run . cluster init"
          go run . cluster init
          echo "cluster init completed"

      - name: Run ForgeTool Genconfig
        run: |
          set -euo pipefail
          echo "Running: go run . cluster genconfig"
          go run . cluster genconfig
          echo "clustergenconfig completed"

      - name: Run ForgeTool Encryption test
        run: |
          set -euo pipefail
          echo "Running: go run . encrypt"
          go run .  encrypt
          echo "Running: go run . checkcrypt"
          go run .  checkcrypt
          echo "Running: go run . decrypt"
          go run .  decrypt
          echo "Encryption test completed"


      - name: Start Talos nodes in Docker
        run: |
          set -euo pipefail
          
          docker network create --subnet 10.5.0.0/24 talosnet

          TALOS_DATA_ROOT="${RUNNER_TEMP}/talos-persist"
          CONTROL_ROOT="${TALOS_DATA_ROOT}/control"
          WORKER_ROOT="${TALOS_DATA_ROOT}/worker"

          mkdir -p \
            "${CONTROL_ROOT}/system/state" \
            "${CONTROL_ROOT}/system/var" \
            "${CONTROL_ROOT}/system/cni" \
            "${CONTROL_ROOT}/system/kubernetes" \
            "${CONTROL_ROOT}/system/libexec" \
            "${CONTROL_ROOT}/system/opt" \
            "${CONTROL_ROOT}/data/openebs" \
            "${WORKER_ROOT}/system/state" \
            "${WORKER_ROOT}/system/var" \
            "${WORKER_ROOT}/system/cni" \
            "${WORKER_ROOT}/system/kubernetes" \
            "${WORKER_ROOT}/system/libexec" \
            "${WORKER_ROOT}/system/opt" \
            "${WORKER_ROOT}/data/openebs"


          docker run -d \
            --name talos-control-1 \
            --hostname talos-control-1 \
            --restart unless-stopped \
            --privileged \
            --read-only \
            --tmpfs /run \
            --tmpfs /system \
            --tmpfs /tmp \
            --network talosnet \
            --ip "${CONTROL_IP}" \
            -v "${CONTROL_ROOT}/system/state:/system/state" \
            -v "${CONTROL_ROOT}/system/var:/var" \
            -v "${CONTROL_ROOT}/system/cni:/etc/cni" \
            -v "${CONTROL_ROOT}/system/kubernetes:/etc/kubernetes" \
            -v "${CONTROL_ROOT}/system/libexec:/usr/libexec/kubernetes" \
            -v "${CONTROL_ROOT}/system/opt:/opt" \
            -v "${CONTROL_ROOT}/data/openebs:/var/openebs/local" \
            -e PLATFORM=container \
            "${TALOS_IMAGE}"

          docker run -d \
            --name talos-worker-1 \
            --hostname talos-worker-1 \
            --restart unless-stopped \
            --privileged \
            --read-only \
            --tmpfs /run \
            --tmpfs /system \
            --tmpfs /tmp \
            --network talosnet \
            --ip "${WORKER_IP}" \
            -v "${WORKER_ROOT}/system/state:/system/state" \
            -v "${WORKER_ROOT}/system/var:/var" \
            -v "${WORKER_ROOT}/system/cni:/etc/cni" \
            -v "${WORKER_ROOT}/system/kubernetes:/etc/kubernetes" \
            -v "${WORKER_ROOT}/system/libexec:/usr/libexec/kubernetes" \
            -v "${WORKER_ROOT}/system/opt:/opt" \
            -v "${WORKER_ROOT}/data/openebs:/var/openebs/local" \
            -e PLATFORM=container \
            "${TALOS_IMAGE}"

          echo "Waiting 10 seconds for Talos containers to initialize..."
          sleep 10

          echo "=== talos-control-1 logs ==="
          docker logs talos-control-1

          echo "=== talos-worker-1 logs ==="
          docker logs talos-worker-1

## TODO getting this to work
      - name: Run ForgeTool Apply-Bootstrap
        run: |
          set -euo pipefail
          echo "Running: go run . talos apply --non-interactive"
          go run . talos apply --non-interactive
          echo "apply and bootstrap completed"#

      - name: Verify Talos services
        run: |
          set -euo pipefail#
          go run . talosctl --talosconfig /tmp/talos/talosconfig -n "${EFFECTIVE_VIP}" service etcd
          go run . talosctl --talosconfig /tmp/talos/talosconfig -n "${EFFECTIVE_VIP}" service kube-apiserver
          go run . talosctl --talosconfig /tmp/talos/talosconfig -n "${EFFECTIVE_VIP}" service kubelet
          go run . talosctl --talosconfig /tmp/talos/talosconfig -n "${WORKER_IP}" service kubelet#
          go run . talosctl --talosconfig /tmp/talos/talosconfig -n "${EFFECTIVE_VIP},${WORKER_IP}" get machinestatus

      - name: Collect Talos logs on failure
        if: failure()
        run: |
          set +e
          docker logs talos-control-1
          docker logs talos-worker-1

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: talos-docker-logs
          path: |
            /tmp/talos-control-1.log
            /tmp/talos-worker-1.log

      - name: Cleanup containers and network
        if: always()
        run: |
          docker rm -f talos-control-1 talos-worker-1 2>/dev/null || true
          docker network rm talosnet 2>/dev/null || true