name: "Helm Chart Validation"

on:
  pull_request:

concurrency:
  group: ${{ github.head_ref }}-pr-validate
  cancel-in-progress: true

env:
  KUBERNETES_DIR: ./embed/generic/kubernetes

jobs:
  kubeconform:
    name: Kubeconform
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - name: Setup Homebrew
        uses: Homebrew/actions/setup-homebrew@master
      - name: Setup Workflow Tools
        run: brew install fluxcd/tap/flux kubeconform kustomize
      - name: Create dummy deploykey secret (CI only)
        shell: bash
        run: |
          SECRET_PATH="embed/generic/kubernetes/flux-system/flux/deploykey.secret.yaml"

          if [[ ! -f "$SECRET_PATH" ]]; then
            echo "Creating dummy deploykey.secret.yaml for kubeconform"
            mkdir -p "$(dirname "$SECRET_PATH")"
            touch "$SECRET_PATH"
          fi
      - name: Inject ConfigMap data for CI
        shell: bash
        run: |
          CONFIG_PATH="embed/generic/kubernetes/flux-system/flux/clustersettings.secret.yaml"

          if [[ -f "$CONFIG_PATH" ]]; then
            echo "Replacing REPLACEWITHENV in clustersettings.secret.yaml"

            # Example: replace with dummy key-values for CI
            sed -i "s|REPLACEWITHENV|  dummyKey: dummyValue|" "$CONFIG_PATH"
          fi
      - name: Run kubeconform
        shell: bash
        run: bash ./.github/scripts/kubeconform.sh ${{ env.KUBERNETES_DIR }}

  flux-local:
    name: Flux Local - Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Inject ConfigMap data for CI
        shell: bash
        run: |
          CONFIG_PATH="embed/generic/kubernetes/flux-system/flux/clustersettings.secret.yaml"

          if [[ -f "$CONFIG_PATH" ]]; then
            echo "Replacing REPLACEWITHENV in clustersettings.secret.yaml"

            # Example: replace with dummy key-values for CI
            sed -i "s|REPLACEWITHENV|  dummyKey: dummyValue|" "$CONFIG_PATH"
          fi
      - name: Run flux-local on each HelmRelease
        shell: bash
        run: |
          BASE_DIR="embed/generic/kubernetes"
          
          # Find all HelmRelease YAMLs recursively
          find "$BASE_DIR" -type f -iname "*helm-release.yaml" | while read hrfile; do
            echo "Running flux-local diff on $hrfile"

            name=$(awk '
              /^metadata:/ {inmeta=1; next}
              inmeta && /^[^ ]/ {exit}
              inmeta && $1=="name:" {print $2; exit}
            ' "$hrfile" | tr -d '"')

            namespace=$(awk '
              /^metadata:/ {inmeta=1; next}
              inmeta && /^[^ ]/ {exit}
              inmeta && $1=="namespace:" {print $2; exit}
            ' "$hrfile" | tr -d '"')

            if [[ -z "$name" ]]; then
              echo "⚠️ Could not detect HelmRelease name in $hrfile"
              continue
            fi

            if [[ -z "$namespace" ]]; then
              namespace="default"
            fi

            docker run --rm \
              -v "$PWD":/github/workspace \
              -w /github/workspace \
              ghcr.io/allenporter/flux-local:v8.1.0@sha256:37c3c4309a351830b04f93c323adfcb0e28c368001818cd819cbce3e08828261 \
              diff helmrelease "$name" -n "$namespace" \
                --unified 6 \
                --path "$BASE_DIR" \
                --strip-attrs "helm.sh/chart,checksum/config,checksum/redis,checksum/secrets,app.kubernetes.io/version,chart,app" \
                --limit-bytes 10000 \
                --all-namespaces \
                --sources "cluster" \
                --output-file "${hrfile}.patch"

            # Optional: print the diff
            if [[ -f "${hrfile}.patch" ]]; then
              echo "✅ Diff for $hrfile:"
              cat "${hrfile}.patch"
            fi
          done
