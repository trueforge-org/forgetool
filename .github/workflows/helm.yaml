name: "Helm Chart Validation"

on:
  pull_request:

concurrency:
  group: ${{ github.head_ref }}-pr-validate
  cancel-in-progress: true

env:
  KUBERNETES_DIR: ./embed/generic/kubernetes

jobs:
  kubeconform:
    name: Kubeconform
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - name: Setup Homebrew
        uses: Homebrew/actions/setup-homebrew@master
      - name: Setup Workflow Tools
        run: brew install fluxcd/tap/flux kubeconform kustomize
      - name: Create dummy deploykey secret (CI only)
        shell: bash
        run: |
          SECRET_PATH="embed/generic/kubernetes/flux-system/flux/deploykey.secret.yaml"

          if [[ ! -f "$SECRET_PATH" ]]; then
            echo "Creating dummy deploykey.secret.yaml for kubeconform"
            mkdir -p "$(dirname "$SECRET_PATH")"
            touch "$SECRET_PATH"
          fi
      - name: Inject ConfigMap data for CI
        shell: bash
        run: |
          CONFIG_PATH="embed/generic/kubernetes/flux-system/flux/clustersettings.secret.yaml"

          if [[ -f "$CONFIG_PATH" ]]; then
            echo "Replacing REPLACEWITHENV in clustersettings.secret.yaml"

            # Example: replace with dummy key-values for CI
            sed -i "s|REPLACEWITHENV|  dummyKey: dummyValue|" "$CONFIG_PATH"
          fi
      - name: Run kubeconform
        shell: bash
        run: bash ./.github/scripts/kubeconform.sh ${{ env.KUBERNETES_DIR }}

  helm-diff:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        resources: ['helm-release.yaml']  # can expand if multiple resources

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.12.0

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      - name: Render PR Helm release
        id: render-pr
        run: |
          mkdir -p rendered-pr
          helm template myrelease . > rendered-pr/helm-release.yaml

      - name: Render main branch Helm release
        id: render-main
        run: |
          git fetch origin main
          git checkout origin/main -- .
          mkdir -p rendered-main
          helm template myrelease . > rendered-main/helm-release.yaml

      - name: Generate Diff
        id: diff
        run: |
          diff -uNr rendered-main rendered-pr > diff.patch || true

          # Save diff to GitHub output
          echo 'diff<<EOF' >> $GITHUB_OUTPUT
          cat diff.patch >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

          # Add diff to step summary for GitHub UI
          if [ -s diff.patch ]; then
            echo '## Flux ${{ matrix.resources }} diff' >> $GITHUB_STEP_SUMMARY
            echo '```diff' >> $GITHUB_STEP_SUMMARY
            cat diff.patch >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - if: ${{ steps.diff.outputs.diff != '' }}
        name: Generate GitHub App Token
        uses: actions/create-github-app-token@v2.2.1
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - if: ${{ steps.diff.outputs.diff != '' }}
        name: Add PR Comment
        continue-on-error: true
        uses: mshick/add-pr-comment@v2
        with:
          repo-token: "${{ steps.app-token.outputs.token }}"
          message-id: "${{ github.event.pull_request.number }}/kubernetes/${{ matrix.resources }}"
          header: ${{ github.event.pull_request.number }}/kubernetes/${{ matrix.resources }}
          message-failure: Diff was not successful
          message: |
            ```diff
            ${{ steps.diff.outputs.diff }}
            ```
